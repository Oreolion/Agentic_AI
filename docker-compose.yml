services:
  oracle-free:
    image: container-registry.oracle.com/database/free:latest
    container_name: oracle-free
    restart: unless-stopped

    ports:
      - "1521:1521"

    environment:
      ORACLE_PWD: "YourPassword123"

    volumes:
      - oracle-data:/opt/oracle/oradata

volumes:
  oracle-data:
    name: oracle-data
