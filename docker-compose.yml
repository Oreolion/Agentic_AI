services:
  mongodb:
    image: mongo
    ports:
      - 27017:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    volumes:
      - mongodb_data:/data/db

  vector-db:
    image: qdrant/qdrant
    ports:
      - 6333:6333

volumes:
  mongodb_data:




